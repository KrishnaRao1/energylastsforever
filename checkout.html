<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout – Energy Lasts Forever</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <script src="/products.js"></script>
  <script src="/cart.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .checkout-page { max-width: 500px; margin: 0 auto; padding: 60px 20px; color: white; }
    #link-authentication-element, #address-element, #payment-element { margin: 20px 0; }
    #pay-btn { width: 100%; padding: 16px; background-color: #800080; color: white; border: none;
               border-radius: 8px; font-size: 1.1rem; font-family: 'Orbitron Black', sans-serif; cursor: pointer; margin-top: 10px; }
    #pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #error-message { color: #ff6b6b; margin-top: 10px; font-size: 0.9rem; }
    #promo-message { margin-top: 8px; font-size: 0.85rem; min-height: 1.2em; }
    #promo-message.success { color: #4ade80; }
    #promo-message.error { color: #ff6b6b; }
    .order-summary { border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 15px; margin-bottom: 15px; }
    .summary-line { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; padding: 3px 0; }
    .summary-line.total { font-weight: bold; font-size: 1.05rem; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px; }
    .summary-line.discount { color: #4ade80; }
    .section-label { font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; margin: 20px 0 8px; }
    .promo-row { display: flex; gap: 8px; }
    .promo-row input {
      flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
      background: transparent; color: white; font-size: 0.9rem;
    }
    .promo-row button {
      padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
      background: transparent; color: white; cursor: pointer; font-family: 'Orbitron Black', sans-serif;
      font-size: 0.85rem; white-space: nowrap;
    }
    .promo-row button:hover { border-color: #800080; }
    .promo-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading-text { text-align: center; opacity: 0.7; margin: 30px 0; }
  </style>
</head>
<body>
  <header></header>
  <main>
    <div class="checkout-page" id="checkoutPage">
      <h1 style="text-align:center;">Checkout</h1>

      <div class="order-summary" id="orderSummary">
        <p class="loading-text">Loading your order...</p>
      </div>

      <div class="section-label">Promo Code</div>
      <div class="promo-row">
        <input type="text" id="promoInput" placeholder="Enter code" autocomplete="off" />
        <button type="button" id="promoBtn" disabled>Apply</button>
      </div>
      <div id="promo-message"></div>

      <form id="payment-form">
        <div class="section-label">Contact</div>
        <div id="link-authentication-element"></div>

        <div class="section-label">Shipping Address</div>
        <div id="address-element"></div>

        <div class="section-label">Payment</div>
        <div id="payment-element"></div>

        <button id="pay-btn" type="submit" disabled>Pay Now</button>
        <div id="error-message" role="alert"></div>
      </form>
    </div>
  </main>
  <footer></footer>

  <script>
    const WORKER_URL = "https://el4eshipping.krao30120.workers.dev";
    const STRIPE_PK = "pk_test_51T4B1V7SiKgMpSm2BrhXFJM9wZiwtrF4VO68sXyj1fvUm1FYE7ZO1aohz824OPY4kBnE2XYS0ENAua7LzVb3DjJM00WsMOXkg5";

    const els = {
      page: document.getElementById("checkoutPage"),
      summary: document.getElementById("orderSummary"),
      promoInput: document.getElementById("promoInput"),
      promoBtn: document.getElementById("promoBtn"),
      promoMsg: document.getElementById("promo-message"),
      form: document.getElementById("payment-form"),
      payBtn: document.getElementById("pay-btn"),
      error: document.getElementById("error-message"),
    };

    let stripe = null;
    let elements = null;
    let currentPaymentIntentId = null;
    let currentCart = [];
    let currentTotal = 0;
    let appliedPromoCode = "";
    let busy = false;

    function money(cents) {
      return "$" + (Number(cents || 0) / 100).toFixed(2);
    }

    function esc(str) {
      return String(str).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function setError(msg) {
      els.error.textContent = msg || "";
    }

    function setBusy(state) {
      busy = state;
      els.payBtn.disabled = state || !elements;
      els.promoBtn.disabled = state || !elements;
    }

    function updatePayLabel() {
      els.payBtn.textContent = currentTotal > 0 ? "Pay " + money(currentTotal) : "Pay Now";
    }

    async function post(body) {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("Unexpected response from server.");
      }
      if (!res.ok && !data.error) {
        throw new Error("Server error (" + res.status + ").");
      }
      return data;
    }

    function renderSummary(breakdown) {
      const itemLines = currentCart.map(item => {
        const p = (typeof PRODUCTS !== "undefined") ? PRODUCTS[item.id] : null;
        const name = p ? p.name : item.id;
        const lineTotal = p ? money(p.price * item.qty) : "";
        return `<div class="summary-line"><span>${esc(name)}${item.size ? " (" + esc(item.size) + ")" : ""} × ${item.qty}</span><span>${lineTotal}</span></div>`;
      }).join("");

      let html = itemLines;
      html += `<div class="summary-line"><span>Subtotal</span><span>${money(breakdown.subtotal)}</span></div>`;
      if (breakdown.discount > 0) {
        html += `<div class="summary-line discount"><span>Discount</span><span>-${money(breakdown.discount)}</span></div>`;
      }
      html += `<div class="summary-line"><span>Shipping</span><span>${breakdown.shipping === 0 ? "FREE" : money(breakdown.shipping)}</span></div>`;
      html += `<div class="summary-line"><span>Tax</span><span>${money(breakdown.tax)}</span></div>`;
      html += `<div class="summary-line total"><span>Total</span><span>${money(breakdown.total)}</span></div>`;

      els.summary.innerHTML = html;
      currentTotal = breakdown.total;
      updatePayLabel();
    }

    function showEmptyCart() {
      els.page.innerHTML = "<h1 style='text-align:center;'>Checkout</h1><p style='text-align:center;'>Your cart is empty. <a href='/shop/' style='color:#800080;'>Continue shopping</a></p>";
    }

    async function initialize() {
      if (typeof Stripe !== "function") {
        els.summary.innerHTML = "";
        setError("Payment system failed to load. Disable ad blockers and refresh.");
        return;
      }
      if (typeof getCart !== "function") {
        els.summary.innerHTML = "";
        setError("Cart failed to load. Please refresh.");
        return;
      }

      stripe = Stripe(STRIPE_PK);
      currentCart = getCart() || [];

      if (currentCart.length === 0) {
        showEmptyCart();
        return;
      }

      let data;
      try {
        data = await post({ cart: currentCart });
      } catch (err) {
        els.summary.innerHTML = "";
        setError(err.message || "Could not start checkout. Please refresh.");
        return;
      }

      if (data.error || !data.clientSecret || !data.breakdown) {
        els.summary.innerHTML = "";
        setError(data.error || "Could not start checkout. Please refresh.");
        return;
      }

      currentPaymentIntentId = data.paymentIntentId;
      renderSummary(data.breakdown);

      elements = stripe.elements({
        clientSecret: data.clientSecret,
        appearance: {
          theme: "night",
          variables: {
            colorPrimary: "#800080",
            colorBackground: "#1a1a1a",
            colorText: "#ffffff",
            fontFamily: "system-ui, -apple-system, Segoe UI, sans-serif",
            borderRadius: "8px",
          },
        },
      });

      elements.create("linkAuthentication").mount("#link-authentication-element");
      elements.create("address", { mode: "shipping", fields: { phone: "never" } }).mount("#address-element");

      const paymentElement = elements.create("payment");
      paymentElement.mount("#payment-element");
      paymentElement.on("ready", () => setBusy(false));
    }

    async function applyPromo() {
      if (busy || !elements) return;
      const code = els.promoInput.value.trim();
      if (!code) return;

      setBusy(true);
      els.promoMsg.textContent = "Checking code...";
      els.promoMsg.className = "";

      try {
        const data = await post({
          cart: currentCart,
          promoCode: code,
          paymentIntentId: currentPaymentIntentId,
        });

        if (data.error || !data.breakdown) {
          els.promoMsg.textContent = data.error || "Could not apply code.";
          els.promoMsg.className = "error";
          return;
        }

        renderSummary(data.breakdown);

        if (!data.breakdown.promoApplied) {
          els.promoMsg.textContent = "Invalid promo code.";
          els.promoMsg.className = "error";
          return;
        }

        appliedPromoCode = code;
        els.promoMsg.textContent = "Promo code applied!";
        els.promoMsg.className = "success";

        // Sync Elements with the updated PaymentIntent amount
        const { error } = await elements.fetchUpdates();
        if (error) {
          els.promoMsg.textContent = error.message;
          els.promoMsg.className = "error";
        }
      } catch (err) {
        els.promoMsg.textContent = err.message || "Could not apply code.";
        els.promoMsg.className = "error";
      } finally {
        setBusy(false);
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      if (busy || !elements) return;

      setBusy(true);
      setError("");
      els.payBtn.textContent = "Processing...";

      try {
        const addressElement = elements.getElement("address");
        const { complete } = await addressElement.getValue();

        if (!complete) {
          setError("Please complete your shipping address.");
          return;
        }

        // Shipping address and email are collected automatically from the Address and Link elements.
        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: {
            return_url: window.location.origin + "/success.html",
          },
        });

        if (error) {
          setError(error.message);
        }
      } catch (err) {
        setError(err.message || "Payment failed. Please try again.");
      } finally {
        setBusy(false);
        updatePayLabel();
      }
    }

    els.promoBtn.addEventListener("click", applyPromo);
    els.promoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        applyPromo();
      }
    });
    els.form.addEventListener("submit", handleSubmit);

    initialize();
  </script>
</body>
</html>
